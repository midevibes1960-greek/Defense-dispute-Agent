services:
  - type: web
    name: dispute-defense
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: dispute-defense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      # Persistent disk mount (see disk: above) so cases survive deploys/restarts.
      - key: DATA_DIR
        value: /var/data
      # Set this to password-protect the deployed workspace (Basic Auth).
      # Leave unset only for local development — never deploy with PayPal
      # keys configured and no access password.
      - key: APP_ACCESS_PASSWORD
        sync: false
